name: Playwright tests

# Runs the E2E suite on every PR and on pushes to main. Catches:
#   - page regressions on /bedbug/* (smoke)
#   - SMS-link footer breakage
#   - API route validation drift (sms-inbound signature check, sms-outbound
#     auth, email-inbound basic auth, agent-bridge action handling)
#   - happy-path side-effects via a mock outbound server that intercepts
#     Twilio / Resend / GitHub fetches
#
# Total runtime in CI is well under 2 min so it doesn't slow down review.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            /opt/pw-browsers
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium chromium-headless-shell

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: "1"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
